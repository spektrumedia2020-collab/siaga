include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Style rules
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - avoid_print
    
    # Error handling
    - avoid_catches_without_on_clauses
    - avoid_empty_else
    
    # Design rules
    - prefer_typing_uninitialized_variables
    
    # Performance
    - avoid_slow_async_io