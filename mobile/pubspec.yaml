name: siaga_officer
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.16.0
  flutter_riverpod: ^2.5.0
  go_router: ^15.0.0
  dio: ^5.4.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  geolocator: ^13.0.0
  connectivity_plus: ^6.0.0
  uuid: ^4.3.0
  intl: ^0.19.0
  flutter_dotenv: ^6.0.1
  mobile_scanner: ^7.3.0
  share_plus: ^13.2.1
  printing: ^5.15.0
  pdf: ^3.13.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.jpeg"
  min_sdk_android: 21
  adaptive_icon_background: "#1F7A1F"
  adaptive_icon_foreground: "assets/logo.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpeg
    - .env
